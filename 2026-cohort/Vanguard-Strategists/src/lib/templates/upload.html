<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import Successful - VS Pollinator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #fff5f0 0%,
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #fee0d2 0%,
                    #fcbba1 100%
                );
        }

        .success-container {
            width: 100%;
            max-width: 650px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 24px;

            padding: 55px 50px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.12);

            backdrop-filter: blur(10px);
        }

        .success-icon {
            width: 95px;
            height: 95px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #e8f8ee;

            color: #28a745;

            font-size: 48px;
            font-weight: bold;

            box-shadow:
                0 12px 30px rgba(40, 167, 69, 0.18);
        }

        h1 {
            font-size: 38px;
            color: #333;

            margin-bottom: 12px;
        }

        .description {
            font-size: 16px;
            color: #777;

            line-height: 1.6;

            margin-bottom: 35px;
        }

        .import-result {
            background: #fff8f5;

            border: 1px solid #fee0d2;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 35px;
        }

        .import-result .number {
            display: block;

            font-size: 55px;
            font-weight: 700;

            color: #ef3b2c;

            margin-bottom: 5px;
        }

        .import-result .label {
            font-size: 15px;
            color: #777;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .button {
            flex: 1;

            min-height: 58px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 14px;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: 0.25s ease;
        }

        .button-primary {
            background: linear-gradient(
                135deg,
                #fc9272,
                #ef3b2c
            );

            color: white;

            box-shadow:
                0 12px 25px rgba(239, 59, 44, 0.25);
        }

        .button-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 18px 35px rgba(239, 59, 44, 0.35);
        }

        .button-secondary {
            background: #f7f7f7;

            color: #555;

            border: 1px solid #ddd;
        }

        .button-secondary:hover {
            background: #eeeeee;

            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;

            color: #aaa;

            font-size: 13px;
        }

        @media (max-width: 768px) {

            .success-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 30px;
            }

            .import-result .number {
                font-size: 45px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="success-container">

    <div class="success-icon">
        ✓
    </div>

    <h1>Import Successful!</h1>

    <p class="description">
        Your CSV file has been processed successfully.
    </p>

    <div class="import-result">

        <span class="number">
            {{ import_count }}
        </span>

        <span class="label">
            records imported successfully
        </span>

    </div>

    <div class="buttons">

        <a
            href="/import"
            class="button button-primary"
        >
            Import Another File
        </a>

        <a
            href="/"
            class="button button-secondary"
        >
            Back to Home
        </a>

    </div>

    <div class="footer">
        VS Pollinator
    </div>

</div>

</body>
</html>
