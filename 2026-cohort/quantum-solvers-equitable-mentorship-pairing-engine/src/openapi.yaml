openapi: 3.1.0

info:
  title: Braid API
  version: 0.1.0
  description: |
    Thin vertical slice: program lookup, application intake, magic-link auth,
    roster, matching runs with a fairness summary, and strands with messages.

    The published form schema is here too, so the apply screen renders what a
    coordinator built rather than a hardcoded set of questions.

    Deliberately excluded until the step that needs them: file upload, and the
    pair-level run actions (swap, lock, reject, re-run).

servers:
  - url: http://localhost:8000/v1
    description: Local FastAPI
  - url: https://api.braid.app/v1
    description: Production

security:
  - sessionCookie: []

tags:
  - name: Public
    description: No session required. Reachable from a cold link.
  - name: Auth
    description: Magic-link sign in.
  - name: Participant
    description: Screens scoped to one program, for the person in it.
  - name: Roster
    description: Approved participants in a program.
  - name: Applications
    description: |
      Intake review. The queue between someone applying and appearing on the
      roster, and the decision that moves them across.
  - name: Matching
    description: Batch runs, their fairness summaries, and publication.
  - name: Unmatched
    description: |
      Everyone a run left without a strand, each with the reason why. Every
      reason has a different remedy, which is why it is an enum and not a
      message.
  - name: Setup
    description: |
      What a coordinator configures before a cohort runs: the programme arc and
      the messages it sends.
  - name: Account
    description: |
      Scoped to the person, not to a programme. Everything here is true across
      every programme they belong to.
  - name: Insight
    description: |
      The report a coordinator sends a funder, and the log that makes its
      fairness claim inspectable.
  - name: Comms
    description: Messages sent to a segment of the programme at once.
  - name: Monitoring
    description: |
      Programme health while a cohort is live, and the strands it is made of.
      Everything here is derived, never stored: a quiet strand is a strand that
      has not been written in, not a strand somebody flagged.
  - name: Strands
    description: Mentoring relationships and their message threads.

paths:
  /orgs/{orgSlug}/programs/{programSlug}:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
      - $ref: "#/components/parameters/ProgramSlug"
    get:
      operationId: getProgramBySlug
      tags: [Public]
      summary: Look up a program for its landing page
      description: |
        A closed or full program still resolves, carrying the state that lets the
        landing page offer a waitlist rather than a 404.
      security: []
      responses:
        "200":
          description: The program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramPublic"
        "404":
          $ref: "#/components/responses/NotFound"

  /orgs/{orgSlug}/programs/{programSlug}/form-schema:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
      - $ref: "#/components/parameters/ProgramSlug"
    get:
      operationId: getFormSchema
      tags: [Public]
      summary: Read the published form schema for a role
      description: |
        Mentors and mentees answer different questions, so the role is required
        rather than defaulted.

        Returns the currently published version. Publishing a change mints a new
        version and leaves submitted applications on the one they were filled
        against, so an answer is always readable against the questions that were
        actually asked.

        Public, because the application form is filled before anyone has an
        account.
      security: []
      parameters:
        - name: role
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: The published form version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormVersion"
        "404":
          description: No such program, or no published form for that role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orgs/{orgSlug}/programs/{programSlug}/applications:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
      - $ref: "#/components/parameters/ProgramSlug"
    post:
      operationId: submitApplication
      tags: [Public]
      summary: Submit an application to a program
      description: |
        Answers are keyed by field id, taken from the form version named in
        `formVersionId`. Fields hidden by a condition are absent rather than
        null: a question nobody was shown has no answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Applications are closed, or this email already applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /orgs/{orgSlug}/programs/{programSlug}/waitlist:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
      - $ref: "#/components/parameters/ProgramSlug"
    post:
      operationId: joinWaitlist
      tags: [Public]
      summary: Ask to be told when the next round opens
      description: |
        The action a closed, full or not-yet-open programme offers instead of a
        dead end. Always returns 202, for the same reason the magic-link
        endpoint does: a different answer for a known address would make this an
        enumeration oracle.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /orgs/{orgSlug}/programs/{programSlug}/application-draft:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
      - $ref: "#/components/parameters/ProgramSlug"
    get:
      operationId: getApplicationDraft
      tags: [Public]
      summary: Read a saved draft
      security: []
      parameters:
        - name: draftId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDraft"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveApplicationDraft
      tags: [Public]
      summary: Autosave a partly filled application
      description: |
        Upsert. Omit `draftId` on the first call and the server mints one; the
        client holds it and sends it back on every later save.

        The draft is reachable by whoever holds the id, which is the same
        exposure as `GET /applications/{applicationId}` and is acceptable for
        the same reason: it carries no credential and grants nothing beyond the
        answers already typed on that device.

        Not yet built: emailing a resume link, which architecture 3.2 lists as
        an action. Until it exists the id lives only in the browser that started
        the form, and the screen says so rather than implying otherwise.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDraftSave"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Applications are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /applications/{applicationId}:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getApplication
      tags: [Public]
      summary: Read an application's status
      description: |
        Backs the "what happens next" screen after submitting.

        Access control note: this route is keyed by a raw UUID and requires no
        session, which is acceptable for the mocked slice but is a real access
        control hole. In production the emailed link carries a signed,
        expiring token scoped to this one application, and the raw UUID stops
        being a valid credential.
      security: []
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/magic-link:
    post:
      operationId: requestMagicLink
      tags: [Auth]
      summary: Email a sign-in link
      description: |
        Always returns 202, whether or not an account exists for the address.
        A 404 here would turn the endpoint into an account-enumeration oracle.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "202":
          description: Accepted. A link is sent only if the address has an account.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [Auth]
      summary: Consume a magic-link token and open a session
      description: Sets the `braid_session` cookie. Tokens are single use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Session opened
          headers:
            Set-Cookie:
              schema:
                type: string
              example: braid_session=…; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Token expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/demo:
    post:
      operationId: signInAsDemo
      tags: [Auth]
      summary: Sign in as a seeded demo account
      description: |
        Exists so somebody reviewing a deployed copy can get inside the product.
        The seeded accounts have example.org addresses nobody can receive mail
        at, so the magic-link path is closed to a reviewer, and a sign-in form
        they cannot pass is the same as no deployment at all.

        Returns 404 unless the service was started with demo mode explicitly
        enabled, so it is absent rather than merely unadvertised. It signs in as
        an existing seeded account and creates nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSignInRequest"
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Demo mode is off, or the seed is not loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/signout:
    post:
      operationId: signOut
      tags: [Auth]
      summary: End the current session
      description: Clears the session cookie. Safe to call without a session.
      security: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
              example: braid_session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0

  /auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Resolve the current account and its participations
      description: |
        Every authenticated page depends on this: it resolves the account, the
        programs it belongs to, and the role held in each.
      responses:
        "200":
          description: The current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{programId}/home:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getHome
      tags: [Participant]
      summary: Everything the participant home screen puts on the page
      description: |
        One request, because home answers one question — what should I do right
        now — and four round trips to answer it would leave the screen
        assembling itself in front of the reader.

        Composed for the screen rather than mirroring a table. Architecture 4.1
        fixes the contents: next action, active strands, profile completeness,
        the coordinator's announcement, and the next milestone. The strands
        themselves stay on their own endpoint, because the strands list needs
        them too.
      responses:
        "200":
          description: The home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/roster:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listRoster
      tags: [Roster]
      summary: List approved participants in a program
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ParticipationStatus"
        - name: matched
          in: query
          description: Filter to participants who do or do not hold a strand.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of the roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getDashboard
      tags: [Monitoring]
      summary: Programme health in one response
      description: |
        The screen a coordinator opens daily during a live cohort. The attention
        list is the point of it: counts alone say how things are, and the list
        says what to do about them.
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/strand-monitor:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: monitorStrands
      tags: [Monitoring]
      summary: Every strand in the programme, with its health
      parameters:
        - name: health
          in: query
          schema:
            $ref: "#/components/schemas/StrandHealth"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of strands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrandMonitorPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /strands/{strandId}/nudge:
    parameters:
      - $ref: "#/components/parameters/StrandId"
    post:
      operationId: nudgeStrand
      tags: [Monitoring]
      summary: Send the nudge template to a strand
      description: |
        Uses the programme's nudge template rather than free text, so the
        wording is the one the coordinator already reviewed and every quiet
        strand gets the same message.
      responses:
        "202":
          description: Queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NudgeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The strand has ended, so there is nobody to nudge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /strands/{strandId}/state:
    parameters:
      - $ref: "#/components/parameters/StrandId"
    put:
      operationId: setStrandState
      tags: [Monitoring]
      summary: Pause, resume or end a strand
      description: |
        Ending is one way. A strand that ended keeps its conversation and stays
        readable to both sides; it is not deleted, because the record of what
        was said is the thing participants come back for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrandStateChange"
      responses:
        "200":
          description: The strand in its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That transition is not allowed from the current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /account/settings:
    get:
      operationId: getAccountSettings
      tags: [Account]
      summary: The account, how it wants to be contacted, and what it belongs to
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveAccountSettings
      tags: [Account]
      summary: Change the name or the notification preferences
      description: |
        There is no password here. Sign-in is by emailed link, so an account has
        no password to change, and a settings screen offering one would be
        describing a mechanism that does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSettingsSave"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/programs:
    get:
      operationId: listAccountPrograms
      tags: [Account]
      summary: Every programme this account belongs to
      responses:
        "200":
          description: The programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /participations/{participationId}/mute:
    parameters:
      - name: participationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: muteParticipation
      tags: [Account]
      summary: Stop or resume email from one programme
      description: |
        Muting silences the programme's email. It does not leave it, and the
        strands stay live — somebody stepping back from their inbox has not
        stepped back from their mentor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteChange"
      responses:
        "200":
          description: The updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /participations/{participationId}/leave:
    parameters:
      - name: participationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: leaveProgram
      tags: [Account]
      summary: Leave a programme
      description: |
        Ends the participation and any strand it holds. The conversation is
        kept and the other side is told, because a strand that goes silent with
        no explanation reads as being dropped.
      responses:
        "204":
          description: Left
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A coordinator cannot leave their own programme this way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getInvite
      tags: [Public]
      summary: Read an invitation
      description: |
        Returns the invitation whatever state it is in, including expired. A
        404 for a spent token would send somebody to a dead end when the useful
        answer is that it lapsed and can be reissued.
      security: []
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: respondToInvite
      tags: [Public]
      summary: Accept or decline an invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteResponse"
      responses:
        "200":
          description: |
            Accepted. A session is opened, so somebody arriving from an email
            lands inside the programme rather than on a sign-in form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "204":
          description: Declined
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: The invitation has expired or was already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /invites/{token}/reissue:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: requestNewInvite
      tags: [Public]
      summary: Ask the coordinator for a fresh invitation
      description: |
        What an expired invitation offers instead of a dead end. The coordinator
        is told; no new token is minted here.
      security: []
      responses:
        "202":
          description: The coordinator has been asked
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/me:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getMyProfile
      tags: [Participant]
      summary: The profile the current account holds in this programme
      description: |
        A profile is the application answers, read back against the form version
        they were given on. There is no second shape for a profile: inventing
        one would mean a coordinator's question could be asked and then never
        seen again.
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveMyProfile
      tags: [Participant]
      summary: Save answers to the profile
      description: |
        Partial: only the answers sent are written, so a per-section save cannot
        blank the sections that were not on screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSave"
      responses:
        "200":
          description: The profile as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/directory:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listDirectory
      tags: [Participant]
      summary: Participants a member may browse
      description: |
        Filtered to the opposite role. Mentors at capacity are listed as
        unavailable rather than hidden, per architecture 4.9, so the scarcity
        is visible instead of looking like an empty directory.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: skill
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /participations/{participationId}/profile:
    parameters:
      - name: participationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPublicProfile
      tags: [Participant]
      summary: One participant as other participants see them
      description: |
        Answers to questions flagged `admin` are never included. Those are
        collected for the coordinator, and a profile screen is the easiest place
        to leak them by accident.
      responses:
        "200":
          description: The public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/resources:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listResources
      tags: [Participant]
      summary: What the coordinator has published for participants to read
      responses:
        "200":
          description: The resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/report:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getReport
      tags: [Insight]
      summary: The programme's outcomes over a date range
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orgs/{orgSlug}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgSlug"
    get:
      operationId: listAuditEvents
      tags: [Insight]
      summary: Who changed what, and when
      description: |
        The fairness claim is only inspectable if the deviations from the
        algorithm are recorded. This is that record: criteria edits, form
        versions, run publications, manual pairings, decisions on applications,
        and every export of participant data.
      parameters:
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/criteria:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getCriteria
      tags: [Setup]
      summary: The matching recipe, and the questions it can be built from
      description: |
        Coupled to the published form on purpose: a weight can only exist for a
        question that is actually asked, and a question flagged for matching but
        left unweighted is a question collected for nothing. Both are reported
        here rather than left for the coordinator to notice.
      responses:
        "200":
          description: The recipe and the fields available to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriteriaEditorState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveCriteria
      tags: [Setup]
      summary: Save the recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingRecipeSave"
      responses:
        "200":
          description: The saved recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchingRecipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/criteria/test-run:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: testRunCriteria
      tags: [Setup]
      summary: Score the current roster without drafting anything
      description: |
        Returns the fairness summary and nothing else. No pairs, deliberately:
        architecture 5.5 requires that weight tuning is not driven by looking at
        individual matches, for the same reason the run review puts the summary
        above the names. A coordinator who tunes until one particular pair
        appears has optimised the cohort for one person.

        Nothing is stored. This is not a run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchingRecipeSave"
      responses:
        "200":
          description: What this recipe would produce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FairnessSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/broadcasts:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listBroadcasts
      tags: [Comms]
      summary: What has been sent, and who each segment reaches now
      responses:
        "200":
          description: Send history and current segment sizes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendBroadcast
      tags: [Comms]
      summary: Send or schedule a message to a segment
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
        "400":
          description: |
            An unknown merge code, an empty message, or a segment that currently
            contains nobody. The last is refused rather than sent to zero
            people, because a send that reaches nobody still reads as sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastCreate"

  /programs/{programId}/forms:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getFormEditorState
      tags: [Setup]
      summary: The draft, the live version, and what came before
      description: |
        Everything the builder needs for one role in one response. A programme
        may hold a draft and a published version at once — that is the normal
        state while a coordinator is editing a live form.
      parameters:
        - name: role
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: The editor state for that role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormEditorState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/forms/{role}/draft:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Role"
    put:
      operationId: saveFormDraft
      tags: [Setup]
      summary: Save the working copy
      description: |
        Writes to the draft, never to anything already published. If the role
        has no draft yet, one is started from the published version, so opening
        a live form and editing it cannot alter what applicants are answering
        right now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormDraftSave"
      responses:
        "200":
          description: The saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/forms/{role}/publish:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - name: role
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Role"
    post:
      operationId: publishFormDraft
      tags: [Setup]
      summary: Make the draft the live form
      description: |
        Mints the next version number. Applications already submitted keep the
        version they were answered against for good: the form they saw is part
        of what they said, and re-reading an old application through a new form
        would put questions in someone's mouth.
      responses:
        "200":
          description: The newly published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            There is nothing to publish, or the draft is not publishable — an
            empty form, a question with no label, or a select with no options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/{programId}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listProgramMilestones
      tags: [Setup]
      summary: Read the programme arc
      responses:
        "200":
          description: The milestones, in the order they happen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramMilestone"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveProgramMilestones
      tags: [Setup]
      summary: Replace the programme arc
      description: |
        Written whole rather than per milestone. The arc is one thing a
        coordinator edits as a shape — adding a step changes what comes after
        it — and a sequence of row-level calls would let a half-saved arc exist
        between two of them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramMilestonesSave"
      responses:
        "200":
          description: The saved arc, with ids minted for anything new
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramMilestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/templates:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listTemplates
      tags: [Setup]
      summary: Read every message template and the codes they may use
      responses:
        "200":
          description: The templates, with the merge codes available to them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/templates/{kind}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TemplateKind"
    put:
      operationId: saveTemplate
      tags: [Setup]
      summary: Edit one template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateSave"
      responses:
        "200":
          description: The saved template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
        "400":
          description: |
            The body used a merge code that does not exist. Rejected rather than
            sent, because the failure would otherwise reach a participant as a
            literal brace in an email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: resetTemplate
      tags: [Setup]
      summary: Drop the edit and go back to the default wording
      description: |
        Removes the programme's override. The default text is Braid's, so this
        cannot fail with nothing to fall back on.
      responses:
        "200":
          description: The template, restored to its default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/applications:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications submitted to a program
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/applications/decisions:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      operationId: decideApplications
      tags: [Applications]
      summary: Decide several applications at once
      description: |
        Bulk approve is the action a coordinator reaches for after reading a
        morning's intake, so it is one request rather than a loop the browser
        drives. Partial success is reported rather than hidden: `decided` counts
        what moved, `skipped` names what did not and why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDecision"
      responses:
        "200":
          description: The outcome of each application in the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /applications/{applicationId}/decision:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideApplication
      tags: [Applications]
      summary: Approve, waitlist or reject one application
      description: |
        Approving creates the participation that puts someone on the roster.
        The transition is one way in this slice: there is no un-approve, because
        undoing it would have to decide what happens to a strand they may
        already hold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDecision"
      responses:
        "200":
          description: The application in its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The application has already been decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /form-versions/{formVersionId}:
    parameters:
      - name: formVersionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFormVersion
      tags: [Applications]
      summary: Read one form version by id
      description: |
        An application stores the id of the version it was answered against, and
        answers are keyed by field id. Reading a decided application back
        therefore needs that exact version — not the current published one, which
        may have moved on — or the answers are a map of uuids to values.
      responses:
        "200":
          description: The form version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/unmatched:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listUnmatched
      tags: [Unmatched]
      summary: List everyone in the program with no strand
      parameters:
        - name: reason
          in: query
          schema:
            $ref: "#/components/schemas/UnmatchedReason"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of unmatched participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnmatchedPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /programs/{programId}/runs:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listRuns
      tags: [Matching]
      summary: List matching runs for a program
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRun
      tags: [Matching]
      summary: Start a matching run
      description: |
        Returns immediately with state `queued`. A run is a stored object with a
        lifecycle, not a function call: poll the run to follow it to `drafted`.
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A run is already in progress for this program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      tags: [Matching]
      summary: Read a run, its fairness summary, and its draft pairs
      description: |
        While the run is `queued` or `running`, `progress` advances from 0 to 1
        and `fairnessSummary` is null. Both are populated once it reaches
        `drafted`.
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{runId}/publish:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: publishRun
      tags: [Matching]
      summary: Publish a drafted run
      description: |
        Irreversible. Converts every draft pair into an active strand and
        notifies both sides.
      responses:
        "200":
          description: Run published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run is not in a publishable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/{programId}/strands:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: listStrands
      tags: [Strands]
      summary: List the strands the current account holds in a program
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/StrandState"
      responses:
        "200":
          description: The strands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrandSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createStrand
      tags: [Unmatched]
      summary: Pair two people by hand
      description: |
        The remedy for most unmatched reasons. Stored with origin mode `manual`
        so reports can answer whether the algorithm did better than the
        coordinator's hand-picks, which is the whole reason origin mode exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrandCreate"
      responses:
        "201":
          description: The strand, active immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: One of the two already holds a strand, or the mentor is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /strands/{strandId}:
    parameters:
      - $ref: "#/components/parameters/StrandId"
    get:
      operationId: getStrand
      tags: [Strands]
      summary: Read one strand
      responses:
        "200":
          description: The strand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /strands/{strandId}/messages:
    parameters:
      - $ref: "#/components/parameters/StrandId"
    get:
      operationId: listMessages
      tags: [Strands]
      summary: Read a strand's message thread
      description: >
        Newest last. Page backwards through history with `before`, or poll
        forwards for new arrivals with `since`. The two describe opposite
        directions and cannot be combined.
      parameters:
        - name: before
          in: query
          description: Return messages sent before this message id.
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          description: >
            Return only messages sent after this message id, oldest first. A
            thread with nothing new answers with an empty list, which is what
            makes polling cheap.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendMessage
      tags: [Strands]
      summary: Send a message to a strand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: braid_session

  parameters:
    OrgSlug:
      name: orgSlug
      in: path
      required: true
      schema:
        type: string
    ProgramSlug:
      name: programSlug
      in: path
      required: true
      schema:
        type: string
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StrandId:
      name: strandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but not permitted here
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable identifier, e.g. `applications_closed`.
        message:
          type: string
          description: Sentence-case text safe to show a person.
        field:
          type: string
          description: Present when the failure belongs to one input.

    Role:
      type: string
      enum: [mentor, mentee]

    ParticipationStatus:
      type: string
      enum: [invited, applied, approved, waitlisted, removed]

    ApplicationStatus:
      type: string
      enum: [submitted, under_review, approved, waitlisted, rejected]

    ProgramState:
      type: string
      enum: [not_yet_open, open, closed, full]

    RunState:
      type: string
      enum: [queued, running, drafted, published, discarded]

    StrandState:
      type: string
      enum: [draft, active, paused, ended, discarded]

    OriginMode:
      type: string
      enum: [manual, self, batch]

    PriorityBand:
      type: string
      enum: [high, medium, low]

    AnswerValue:
      description: One answer to one question.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            type: string

    Provenance:
      type: string
      enum: [self, guided]
      description: |
        Where the words came from. `self` is typed unprompted; `guided` is the
        answer to an elicitation follow-up on the guided completion screen.

        Recorded because scoring free text rewards writing fluency, which tracks
        schooling and language background. Reports have to be able to ask
        whether coverage improved without the guided answers quietly becoming a
        ranking feature.

    AnswerInput:
      type: object
      required: [value, provenance]
      description: |
        One answer on the way in. There is no timestamp: the server stamps it,
        because a client-supplied time is not evidence of anything.
      properties:
        value:
          $ref: "#/components/schemas/AnswerValue"
        provenance:
          $ref: "#/components/schemas/Provenance"

    AnswerRecord:
      type: object
      required: [value, provenance, answeredAt]
      description: One stored answer, as read back.
      properties:
        value:
          $ref: "#/components/schemas/AnswerValue"
        provenance:
          $ref: "#/components/schemas/Provenance"
        answeredAt:
          type: string
          format: date-time

    FormFieldType:
      type: string
      enum:
        [
          short_text,
          long_text,
          single_select,
          multi_select,
          scale,
          number,
          date,
          file,
          consent,
        ]

    FormOption:
      type: object
      required: [id, label]
      description: |
        `id` is what an answer stores. Labels are editable copy and must never be
        the key, or fixing a typo would orphan every answer that used it.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string

    FormClause:
      type: object
      required: [fieldId, operator]
      properties:
        fieldId:
          type: string
          format: uuid
        operator:
          type: string
          enum: [equals, not_equals, includes, is_answered, gt, lt]
        value:
          $ref: "#/components/schemas/AnswerValue"

    FormCondition:
      type: object
      required: [all]
      description: |
        Every clause must hold. One level deep on purpose: `any` can be added
        beside `all` later without migrating a single stored schema.
      properties:
        all:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FormClause"

    FormField:
      type: object
      required: [id, type, label, required, matching, equity, admin]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Stable for the life of the question, across versions and across
            label edits. Answers are keyed by this and never by the label.
        type:
          $ref: "#/components/schemas/FormFieldType"
        label:
          type: string
        help:
          type: [string, "null"]
        required:
          type: boolean
        matching:
          type: boolean
          description: Feeds the similarity score.
        equity:
          type: boolean
          description: Feeds the priority score.
        admin:
          type: boolean
          description: Collected, never scored, visible to the coordinator only.
        visibleWhen:
          oneOf:
            - $ref: "#/components/schemas/FormCondition"
            - type: "null"
        options:
          type: [array, "null"]
          description: Select types only.
          items:
            $ref: "#/components/schemas/FormOption"
        text:
          type: [object, "null"]
          properties:
            minLength:
              type: [integer, "null"]
            maxLength:
              type: [integer, "null"]
            placeholder:
              type: [string, "null"]
        number:
          type: [object, "null"]
          properties:
            min:
              type: [number, "null"]
            max:
              type: [number, "null"]
            step:
              type: [number, "null"]
            unit:
              type: [string, "null"]
        scale:
          type: [object, "null"]
          required: [min, max]
          properties:
            min:
              type: integer
            max:
              type: integer
            minLabel:
              type: [string, "null"]
            maxLabel:
              type: [string, "null"]
        date:
          type: [object, "null"]
          properties:
            min:
              type: [string, "null"]
              format: date
            max:
              type: [string, "null"]
              format: date
        file:
          type: [object, "null"]
          required: [accept, maxSizeBytes]
          properties:
            accept:
              type: array
              items:
                type: string
            maxSizeBytes:
              type: integer
        consent:
          type: [object, "null"]
          required: [statement]
          properties:
            statement:
              type: string
              description: |
                The sentence next to the checkbox. Separate from `label`, which
                names the question in the coordinator's list.
            documentUrl:
              type: [string, "null"]
              format: uri
        selection:
          type: [object, "null"]
          description: Multi select only.
          properties:
            min:
              type: [integer, "null"]
            max:
              type: [integer, "null"]

    FormSection:
      type: object
      required: [id, title, fields]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FormField"

    FormVersion:
      type: object
      required: [id, programId, role, version, sections]
      description: |
        The whole published document. Stored as one versioned JSONB blob rather
        than normalised rows: it is read whole, written whole, and never queried
        field by field.
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        version:
          type: integer
          minimum: 1
        publishedAt:
          type: [string, "null"]
          format: date-time
        sections:
          type: array
          items:
            $ref: "#/components/schemas/FormSection"

    Organisation:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        logoUrl:
          type: [string, "null"]
          format: uri

    ProgramPublic:
      type: object
      required:
        [
          id,
          slug,
          name,
          organisation,
          description,
          state,
          openRoles,
          mentorCount,
          menteeCount,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        organisation:
          $ref: "#/components/schemas/Organisation"
        description:
          type: string
        state:
          $ref: "#/components/schemas/ProgramState"
        cohortStart:
          type: [string, "null"]
          format: date
        cohortEnd:
          type: [string, "null"]
          format: date
        applicationsCloseAt:
          type: [string, "null"]
          format: date-time
        matchingOpensAt:
          type: [string, "null"]
          format: date-time
        timeCommitment:
          type: [string, "null"]
          description: Plain words, e.g. "About two hours a month for six months".
        eligibility:
          type: [string, "null"]
        openRoles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        mentorCount:
          type: integer
        menteeCount:
          type: integer
        capacity:
          type: [integer, "null"]
          description: |
            How many mentees this round can take, from the mentors who have
            signed up and the capacity each set.
        placesRemaining:
          type: [integer, "null"]
          description: |
            Design direction section 9 puts this in the landing hero, and
            section 1 requires scarcity to be shown rather than hidden: a full
            round says zero rather than dropping the number. Null only where a
            programme has not set capacity at all.

    ApplicationDraftSave:
      type: object
      required: [role, formVersionId, answers]
      properties:
        draftId:
          type: string
          format: uuid
          description: Omit on the first save. The server mints one and returns it.
        role:
          $ref: "#/components/schemas/Role"
        formVersionId:
          type: string
          format: uuid
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AnswerInput"

    ApplicationDraft:
      type: object
      required: [draftId, role, formVersionId, answers, savedAt]
      properties:
        draftId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        formVersionId:
          type: string
          format: uuid
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AnswerRecord"
        savedAt:
          type: string
          format: date-time
          description: |
            What the autosave indicator shows. Section 9: a timestamp, never a
            spinner — a spinner says "wait", and the applicant has nothing to
            wait for.

    ApplicationCreate:
      type: object
      required: [role, name, email, formVersionId, answers]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        formVersionId:
          type: string
          format: uuid
          description: |
            Which published version was on screen. Sent so the server can reject
            a submission filled against a version that is no longer current,
            rather than storing answers to questions nobody can reconstruct.
        answers:
          type: object
          description: |
            Keyed by field id. Answers to fields hidden by a condition are not
            sent; the client keeps them locally in case the person toggles back,
            but an unasked question has no answer.
          additionalProperties:
            $ref: "#/components/schemas/AnswerInput"

    Application:
      type: object
      required:
        [
          id,
          programId,
          role,
          name,
          email,
          status,
          submittedAt,
          formVersionId,
          answers,
        ]
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        programName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        decidedBy:
          type: [string, "null"]
          description: The coordinator who decided it, for the audit log.
        editableUntil:
          type: [string, "null"]
          format: date-time
        matchingOpensAt:
          type: [string, "null"]
          format: date-time
        formVersionId:
          type: string
          format: uuid
          description: |
            The version these answers were filled against. Reading them back
            without it would mean guessing which questions were asked.
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AnswerRecord"

    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        orgSlug:
          type: string
          description: Return the person to this program after verifying.
        programSlug:
          type: string

    VerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    DemoSignInRequest:
      type: object
      required: [as]
      properties:
        as:
          type: string
          description: |
            Which side of the product to look at. `coordinator` lands on the
            admin screens, `participant` on a mentee's own.
          enum: [coordinator, participant]

    Account:
      type: object
      required: [id, name, email, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        photoUrl:
          type: [string, "null"]
          format: uri

    ParticipationSummary:
      type: object
      required: [id, programId, programName, orgSlug, programSlug, role, status]
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        programName:
          type: string
        organisationName:
          type: string
        orgSlug:
          type: string
        programSlug:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/ParticipationStatus"
        isCoordinator:
          type: boolean
          default: false

    Session:
      type: object
      required: [account, participations]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        participations:
          type: array
          items:
            $ref: "#/components/schemas/ParticipationSummary"

    RosterEntry:
      type: object
      required:
        [id, account, role, status, matched, profileCompleteness, joinedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The participation id, not the account id.
        account:
          $ref: "#/components/schemas/Account"
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/ParticipationStatus"
        matched:
          type: boolean
        capacity:
          type: [integer, "null"]
          description: Mentors only. How many mentees they will take.
        load:
          type: [integer, "null"]
          description: Mentors only. Active strands held. May exceed capacity.
        profileCompleteness:
          type: number
          minimum: 0
          maximum: 1
        timezone:
          type: [string, "null"]
          description: IANA name, e.g. Africa/Lagos.
        joinedAt:
          type: string
          format: date-time

    DigestFrequency:
      type: string
      enum: [off, daily, weekly]

    NotificationPreferences:
      type: object
      required:
        [newMessage, matchPublished, milestoneReminders, broadcasts, digest]
      description: |
        Per kind rather than one switch. Somebody who wants to know when their
        mentor writes but not when the programme sends a newsletter should not
        have to choose between both and neither.
      properties:
        newMessage:
          type: boolean
        matchPublished:
          type: boolean
        milestoneReminders:
          type: boolean
        broadcasts:
          type: boolean
        digest:
          $ref: "#/components/schemas/DigestFrequency"

    AccountProgram:
      type: object
      required:
        [
          participationId,
          programId,
          programName,
          organisationName,
          orgSlug,
          programSlug,
          role,
          status,
          muted,
          unreadCount,
          readOnly,
        ]
      properties:
        participationId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        programName:
          type: string
        organisationName:
          type: string
        orgSlug:
          type: string
        programSlug:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/ParticipationStatus"
        isCoordinator:
          type: boolean
        muted:
          type: boolean
        unreadCount:
          type: integer
        readOnly:
          type: boolean
          description: |
            True once a cohort has finished. The programme stays open to read;
            architecture 4.17 asks for exactly that rather than hiding it.

    AccountSettings:
      type: object
      required: [account, notifications, programs]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        notifications:
          $ref: "#/components/schemas/NotificationPreferences"
        programs:
          type: array
          items:
            $ref: "#/components/schemas/AccountProgram"

    AccountSettingsSave:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        notifications:
          $ref: "#/components/schemas/NotificationPreferences"

    MuteChange:
      type: object
      required: [muted]
      properties:
        muted:
          type: boolean

    InviteState:
      type: string
      enum: [pending, accepted, declined, expired]

    Invite:
      type: object
      required:
        [
          token,
          state,
          email,
          organisationName,
          programName,
          orgSlug,
          programSlug,
          role,
          invitedByName,
        ]
      properties:
        token:
          type: string
        state:
          $ref: "#/components/schemas/InviteState"
        email:
          type: string
          format: email
        organisationName:
          type: string
        programName:
          type: string
        orgSlug:
          type: string
        programSlug:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        invitedByName:
          type: string
        message:
          type: [string, "null"]
          description: An optional line from whoever sent it.
        expiresAt:
          type: [string, "null"]
          format: date-time
        hasAccount:
          type: boolean
          default: false
          description: |
            Whether the invited address already belongs to an account. Decides
            whether accepting joins an existing one or starts a new one, and the
            screen says which so nobody fears a duplicate.

    InviteResponse:
      type: object
      required: [accept]
      properties:
        accept:
          type: boolean
        name:
          type: [string, "null"]
          description: Required when accepting without an existing account.

    InviteAccepted:
      type: object
      required: [session, orgSlug, programSlug]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        orgSlug:
          type: string
        programSlug:
          type: string

    ProfileView:
      type: object
      required:
        [participationId, name, role, completeness, formVersion, answers, thinFieldIds]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        photoUrl:
          type: [string, "null"]
          format: uri
        headline:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        completeness:
          type: number
          minimum: 0
          maximum: 1
        formVersion:
          $ref: "#/components/schemas/FormVersion"
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AnswerRecord"
        thinFieldIds:
          type: array
          description: |
            Unanswered, or answered so briefly there is nothing to match on.
            What guided completion would ask about next.
          items:
            type: string
            format: uuid

    ProfileSave:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          description: Only the fields being saved. Absent fields are left alone.
          additionalProperties:
            $ref: "#/components/schemas/AnswerInput"

    DirectoryEntry:
      type: object
      required: [participationId, name, role, skills, available]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        photoUrl:
          type: [string, "null"]
        headline:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        skills:
          type: array
          items:
            type: string
        available:
          type: boolean
          description: |
            False for a mentor already at the capacity they set. Shown rather
            than filtered out, so a member can see that the shortage is real.
        unavailableReason:
          type: [string, "null"]

    DirectoryPage:
      type: object
      required: [items, page, pageSize, total, selfMatchingEnabled, skills]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        selfMatchingEnabled:
          type: boolean
          description: |
            The directory only exists when the coordinator turned self-matching
            on. False is a real state, not an error.
        skills:
          type: array
          description: Every skill in the browsable set, for the filter.
          items:
            type: string

    PublicProfile:
      type: object
      required: [participationId, name, role, skills, available, sections]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        photoUrl:
          type: [string, "null"]
        headline:
          type: [string, "null"]
        timezone:
          type: [string, "null"]
        skills:
          type: array
          items:
            type: string
        available:
          type: boolean
        capacity:
          type: [integer, "null"]
        load:
          type: [integer, "null"]
        sections:
          type: array
          description: |
            Shareable answers only, already grouped and labelled. Questions
            flagged `admin` never appear.
          items:
            $ref: "#/components/schemas/PublicProfileSection"

    PublicProfileSection:
      type: object
      required: [title, entries]
      properties:
        title:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PublicProfileEntry"

    PublicProfileEntry:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    ResourceKind:
      type: string
      enum:
        [
          handbook,
          expectations,
          conversation_starters,
          code_of_conduct,
          other,
        ]

    Resource:
      type: object
      required: [id, title, kind, url]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        kind:
          $ref: "#/components/schemas/ResourceKind"
        url:
          type: string
        sizeBytes:
          type: [integer, "null"]
        updatedAt:
          type: [string, "null"]
          format: date-time

    TimePoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number

    CountPoint:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer

    MilestoneCompletion:
      type: object
      required: [title, completed, total]
      properties:
        title:
          type: string
        completed:
          type: integer
        total:
          type: integer

    DropOffStage:
      type: object
      required: [stage, count]
      description: |
        The funnel from applying to still meeting. Reported as counts at each
        stage rather than as a single retention figure, because where people
        leave is the thing a programme can act on.
      properties:
        stage:
          type: string
          enum:
            [
              applied,
              approved,
              matched,
              first_message,
              first_session,
              still_active,
            ]
        count:
          type: integer

    DemographicBreakdown:
      type: object
      required: [fieldId, label, buckets, suppressedBuckets]
      description: |
        Only fields participants consented to share are ever returned. Buckets
        smaller than the suppression threshold are withheld rather than
        rounded: in a cohort of twenty, "one person" plus any other column is
        an identification.
      properties:
        fieldId:
          type: string
          format: uuid
        label:
          type: string
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/CountPoint"
        suppressedBuckets:
          type: integer
          description: How many buckets were withheld as too small to report.

    ProgramReport:
      type: object
      required:
        [
          programName,
          from,
          to,
          coverageOverTime,
          mentorLoad,
          qualityByBand,
          sessionsByWeek,
          checkInSentiment,
          milestoneCompletion,
          dropOff,
          demographics,
          suppressionThreshold,
        ]
      properties:
        programName:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        coverageOverTime:
          type: array
          items:
            $ref: "#/components/schemas/TimePoint"
        mentorLoad:
          type: array
          items:
            $ref: "#/components/schemas/MentorLoad"
        qualityByBand:
          type: array
          items:
            $ref: "#/components/schemas/PriorityBandStat"
        sessionsByWeek:
          type: array
          items:
            $ref: "#/components/schemas/CountPoint"
        checkInSentiment:
          type: array
          description: Responses at each point on the scale.
          items:
            $ref: "#/components/schemas/CountPoint"
        checkInResponseRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        milestoneCompletion:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneCompletion"
        dropOff:
          type: array
          items:
            $ref: "#/components/schemas/DropOffStage"
        demographics:
          type: array
          items:
            $ref: "#/components/schemas/DemographicBreakdown"
        suppressionThreshold:
          type: integer
          description: Buckets at or below this size are withheld.

    AuditAction:
      type: string
      enum:
        [
          criteria_saved,
          form_published,
          run_published,
          pair_overridden,
          manual_pairing,
          application_decided,
          participant_edited,
          strand_ended,
          broadcast_sent,
          template_edited,
          data_exported,
        ]

    AuditEvent:
      type: object
      required: [id, at, actorName, action, summary]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorName:
          type: string
        action:
          $ref: "#/components/schemas/AuditAction"
        summary:
          type: string
          description: |
            Written server-side and in plain words. An audit line that needs the
            reader to know the schema is not inspectable by the people it exists
            for.
        subjectLabel:
          type: [string, "null"]
          description: What was changed, named the way a person would name it.

    AuditPage:
      type: object
      required: [items, page, pageSize, total, actors]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        actors:
          type: array
          description: Everyone who appears in the log, for the filter.
          items:
            type: string

    HardConstraintKind:
      type: string
      description: |
        A pair that fails an enabled constraint is never proposed, whatever it
        scores. Kept few and blunt on purpose: every constraint added here
        shrinks the pool, and a shrunken pool is what produces unmatched people.
      enum: [same_timezone_band, shared_skill, different_team, role_compatible]

    HardConstraint:
      type: object
      required: [kind, enabled]
      properties:
        kind:
          $ref: "#/components/schemas/HardConstraintKind"
        enabled:
          type: boolean

    WeightDirection:
      type: string
      description: |
        `similar` rewards two people answering alike; `complementary` rewards
        them answering differently. Skills usually want complementary — a mentor
        who already knows what the mentee knows teaches them nothing — and
        availability usually wants similar.
      enum: [similar, complementary]

    FieldWeight:
      type: object
      required: [fieldId, weight, direction]
      properties:
        fieldId:
          type: string
          format: uuid
        weight:
          type: integer
          minimum: 0
          maximum: 100
          description: Zero means the question is collected but does not score.
        direction:
          $ref: "#/components/schemas/WeightDirection"

    PriorityWeight:
      type: object
      required: [fieldId, weight]
      properties:
        fieldId:
          type: string
          format: uuid
        weight:
          type: integer
          minimum: 0
          maximum: 100

    FairnessRules:
      type: object
      required: [coverageFloor, priorityWeights]
      properties:
        mentorCapacityCap:
          type: [integer, "null"]
          description: |
            A ceiling over what mentors set for themselves. Null respects each
            mentor's own number.
        coverageFloor:
          type: number
          minimum: 0
          maximum: 1
          description: |
            The share of mentees a run must place before it is worth reviewing.
            A recipe tuned for quality alone will happily match six people
            perfectly and leave thirty out.
        priorityWeights:
          type: array
          items:
            $ref: "#/components/schemas/PriorityWeight"

    MatchingRecipe:
      type: object
      required: [name, version, hardConstraints, weights, fairness]
      properties:
        name:
          type: string
        version:
          type: integer
        hardConstraints:
          type: array
          items:
            $ref: "#/components/schemas/HardConstraint"
        weights:
          type: array
          items:
            $ref: "#/components/schemas/FieldWeight"
        fairness:
          $ref: "#/components/schemas/FairnessRules"
        updatedAt:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]

    MatchingRecipeSave:
      type: object
      required: [name, hardConstraints, weights, fairness]
      properties:
        name:
          type: string
          minLength: 1
        hardConstraints:
          type: array
          items:
            $ref: "#/components/schemas/HardConstraint"
        weights:
          type: array
          items:
            $ref: "#/components/schemas/FieldWeight"
        fairness:
          $ref: "#/components/schemas/FairnessRules"

    CriteriaField:
      type: object
      required: [fieldId, label, role, type]
      description: A question from the published form that a weight may refer to.
      properties:
        fieldId:
          type: string
          format: uuid
        label:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        type:
          $ref: "#/components/schemas/FormFieldType"

    CriteriaEditorState:
      type: object
      required: [recipe, matchingFields, equityFields]
      properties:
        recipe:
          $ref: "#/components/schemas/MatchingRecipe"
        matchingFields:
          type: array
          description: Published questions flagged for matching.
          items:
            $ref: "#/components/schemas/CriteriaField"
        equityFields:
          type: array
          description: Published questions flagged for priority.
          items:
            $ref: "#/components/schemas/CriteriaField"

    BroadcastSegment:
      type: string
      enum:
        [
          everyone,
          mentors,
          mentees,
          unmatched,
          quiet_strands,
          incomplete_profiles,
        ]

    SegmentCount:
      type: object
      required: [segment, count]
      properties:
        segment:
          $ref: "#/components/schemas/BroadcastSegment"
        count:
          type: integer

    BroadcastState:
      type: string
      enum: [scheduled, sending, sent]

    Broadcast:
      type: object
      required:
        [id, segment, subject, body, recipientCount, state, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        segment:
          $ref: "#/components/schemas/BroadcastSegment"
        subject:
          type: string
        body:
          type: string
        recipientCount:
          type: integer
          description: |
            Counted when it was sent, not now. A segment's size changes, and a
            history that recomputed it would rewrite what happened.
        state:
          $ref: "#/components/schemas/BroadcastState"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        scheduledFor:
          type: [string, "null"]
          format: date-time
        deliveredCount:
          type: integer
        failedCount:
          type: integer

    BroadcastCreate:
      type: object
      required: [segment, subject, body]
      properties:
        segment:
          $ref: "#/components/schemas/BroadcastSegment"
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        scheduledFor:
          type: [string, "null"]
          format: date-time
          description: Null sends now.

    BroadcastListing:
      type: object
      required: [items, segments, mergeCodes]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Broadcast"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SegmentCount"
        mergeCodes:
          type: array
          items:
            $ref: "#/components/schemas/MergeCode"

    FormVersionSummary:
      type: object
      required: [id, version, questionCount]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        publishedAt:
          type: [string, "null"]
          format: date-time
        questionCount:
          type: integer
        applicationCount:
          type: integer
          description: |
            How many applications were answered against this version. The
            reason an old version cannot be deleted.

    FormEditorState:
      type: object
      required: [role, history]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        draft:
          oneOf:
            - $ref: "#/components/schemas/FormVersion"
            - type: "null"
          description: The working copy. Null when nothing is being edited.
        published:
          oneOf:
            - $ref: "#/components/schemas/FormVersion"
            - type: "null"
          description: |
            What applicants are answering now. Null before the first publish,
            which is the state a new programme starts in.
        history:
          type: array
          description: Every version, newest first, including the live one.
          items:
            $ref: "#/components/schemas/FormVersionSummary"

    FormDraftSave:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: "#/components/schemas/FormSection"

    AttentionKind:
      type: string
      description: |
        Each value is a thing a human has to decide, not a metric. Anything that
        resolves itself with time does not belong here.
      enum:
        [
          applications_waiting,
          strands_never_started,
          quiet_strands,
          mentors_over_capacity,
          incomplete_profiles,
          unmatched_people,
        ]

    AttentionItem:
      type: object
      required: [kind, count, title, actionLabel, href]
      properties:
        kind:
          $ref: "#/components/schemas/AttentionKind"
        count:
          type: integer
          minimum: 1
        title:
          type: string
        body:
          type: [string, "null"]
        actionLabel:
          type: string
        href:
          type: string
          description: |
            Relative to the programme's admin base, so the server does not have
            to know the org slug the coordinator arrived by.

    DashboardSummary:
      type: object
      required:
        [
          mentorCount,
          menteeCount,
          matchedCount,
          unmatchedCount,
          activeStrands,
          quietStrands,
          sessionsLoggedThisWeek,
          attention,
        ]
      properties:
        mentorCount:
          type: integer
        menteeCount:
          type: integer
        recruitmentGoal:
          type: [integer, "null"]
          description: Mentees the programme set out to recruit. Null if none was set.
        matchedCount:
          type: integer
        unmatchedCount:
          type: integer
        activeStrands:
          type: integer
        quietStrands:
          type: integer
          description: Active strands with no message for fourteen days.
        sessionsLoggedThisWeek:
          type: integer
        upcomingMilestone:
          oneOf:
            - $ref: "#/components/schemas/Milestone"
            - type: "null"
        attention:
          type: array
          description: |
            Ordered by how much it costs to leave alone, not by count. An
            empty list is a real and good answer.
          items:
            $ref: "#/components/schemas/AttentionItem"

    StrandHealth:
      type: string
      description: |
        Derived from activity, never stored. `not_started` is separated from
        `quiet` deliberately: a pair who never began needs an introduction, and
        a pair who stopped needs a different conversation.
      enum: [on_track, slow, quiet, not_started, ended]

    StrandMonitorEntry:
      type: object
      required:
        [
          id,
          state,
          originMode,
          members,
          sessionsLogged,
          milestonesCompleted,
          milestonesTotal,
          health,
        ]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/StrandState"
        originMode:
          $ref: "#/components/schemas/OriginMode"
        members:
          type: array
          items:
            $ref: "#/components/schemas/StrandMember"
        daysSinceActivity:
          type: [integer, "null"]
          description: Null when nothing has ever been said.
        sessionsLogged:
          type: integer
        milestonesCompleted:
          type: integer
        milestonesTotal:
          type: integer
        health:
          $ref: "#/components/schemas/StrandHealth"

    StrandHealthCounts:
      type: object
      required: [on_track, slow, quiet, not_started, ended]
      properties:
        on_track:
          type: integer
        slow:
          type: integer
        quiet:
          type: integer
        not_started:
          type: integer
        ended:
          type: integer

    StrandMonitorPage:
      type: object
      required: [items, page, pageSize, total, healthCounts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StrandMonitorEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        healthCounts:
          $ref: "#/components/schemas/StrandHealthCounts"

    NudgeResult:
      type: object
      required: [sentTo]
      properties:
        sentTo:
          type: integer
          description: How many people the nudge went to.

    StrandStateChange:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [active, paused, ended]
        reason:
          type: [string, "null"]
          description: Recorded against the change for the audit log.

    ProgramMilestone:
      type: object
      required: [id, title, weekOffset, position]
      description: |
        A point in the programme arc, defined against the cohort start rather
        than a calendar date. Cohorts get re-run with new dates and the arc is
        the part that stays the same.

        Distinct from `Milestone`, which is one participant's resolved instance
        of this — that one has a real due date and a done flag.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        weekOffset:
          type: integer
          minimum: 0
          description: Weeks after the cohort starts.
        strandPrompt:
          type: [string, "null"]
          description: |
            Shown inside every strand when this point is reached. The whole
            reason milestones exist rather than living in a coordinator's
            calendar: the arc has to reach the people in it.
        reminderDaysBefore:
          type: [integer, "null"]
          minimum: 0
          description: Null means no reminder is sent.
        position:
          type: integer
          description: Order in the arc. Ties on weekOffset are broken by this.

    ProgramMilestoneInput:
      type: object
      required: [title, weekOffset, position]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Null for a milestone being added.
        title:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        weekOffset:
          type: integer
          minimum: 0
        strandPrompt:
          type: [string, "null"]
        reminderDaysBefore:
          type: [integer, "null"]
          minimum: 0
        position:
          type: integer

    ProgramMilestonesSave:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProgramMilestoneInput"

    TemplateKind:
      type: string
      enum: [welcome, match_notification, nudge, mid_point_check_in, closing]

    MessageTemplate:
      type: object
      required: [kind, subject, body, isDefault]
      properties:
        kind:
          $ref: "#/components/schemas/TemplateKind"
        subject:
          type: string
        body:
          type: string
        isDefault:
          type: boolean
          description: |
            True while the programme has not overridden the wording. Shown so a
            coordinator can tell what she has written from what she inherited.
        updatedAt:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]

    MessageTemplateSave:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1

    MergeCode:
      type: object
      required: [code, description, sample]
      properties:
        code:
          type: string
          description: Written in the body as {code}.
        description:
          type: string
        sample:
          type: string
          description: |
            What it resolves to in the preview. Carried by the API so the
            preview shows the same substitution the sender will perform, rather
            than one the browser invented.

    TemplateSet:
      type: object
      required: [items, mergeCodes]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageTemplate"
        mergeCodes:
          type: array
          items:
            $ref: "#/components/schemas/MergeCode"

    ApplicationSummary:
      type: object
      required:
        [id, programId, role, name, email, status, submittedAt, completeness]
      description: |
        The review table's row. Deliberately not the whole Application: a
        coordinator scanning a morning's intake does not need every answer
        loaded, and the detail screen reads the full record when one is opened.
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        submittedAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        decidedBy:
          type: [string, "null"]
        completeness:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Answered fields over askable ones, for the version this application
            was answered against. A low figure is not a reason to reject; it is
            a reason to read it first.
        flags:
          type: array
          description: |
            Things worth a second look before deciding, named rather than
            scored: an incomplete answer set, a duplicate email, an applicant
            who has applied to this program before.
          items:
            $ref: "#/components/schemas/ApplicationFlag"

    ApplicationFlag:
      type: string
      enum: [incomplete, duplicate_email, reapplied, over_subscribed_role]

    ApplicationPage:
      type: object
      required: [items, page, pageSize, total, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        counts:
          $ref: "#/components/schemas/ApplicationCounts"

    ApplicationCounts:
      type: object
      required: [submitted, under_review, approved, waitlisted, rejected]
      description: |
        The whole queue's shape, independent of the current filter, so the tabs
        can carry counts without a request each.
      properties:
        submitted:
          type: integer
        under_review:
          type: integer
        approved:
          type: integer
        waitlisted:
          type: integer
        rejected:
          type: integer

    DecisionKind:
      type: string
      enum: [approve, waitlist, reject]

    ApplicationDecision:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/DecisionKind"
        note:
          type: [string, "null"]
          description: |
            Recorded against the decision for the audit log. Not sent to the
            applicant; the message they receive comes from a template.

    BulkDecision:
      type: object
      required: [applicationIds, decision]
      properties:
        applicationIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        decision:
          $ref: "#/components/schemas/DecisionKind"
        note:
          type: [string, "null"]

    BulkDecisionResult:
      type: object
      required: [decided, skipped]
      properties:
        decided:
          type: integer
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedDecision"

    SkippedDecision:
      type: object
      required: [applicationId, reason]
      properties:
        applicationId:
          type: string
          format: uuid
        reason:
          type: string

    UnmatchedReason:
      type: string
      description: |
        Every value here has a different remedy, which is why the queue stores a
        code rather than a sentence. No capacity needs a mentor; no overlap
        needs a different pool or a group; an incomplete profile needs the
        participant, not the coordinator.
      enum:
        [
          no_mentor_capacity,
          no_skill_overlap,
          joined_after_run,
          incomplete_profile,
          all_candidates_declined,
        ]

    UnmatchedEntry:
      type: object
      required: [participationId, name, role, reason, profileCompleteness, joinedAt]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        reason:
          $ref: "#/components/schemas/UnmatchedReason"
        profileCompleteness:
          type: number
          minimum: 0
          maximum: 1
        timezone:
          type: [string, "null"]
        skills:
          type: array
          items:
            type: string
        joinedAt:
          type: string
          format: date-time
        lastRunId:
          type: [string, "null"]
          format: uuid
          description: The run that left them here, if any has been published.

    UnmatchedPage:
      type: object
      required: [items, page, pageSize, total, availableMentors]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UnmatchedEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        availableMentors:
          type: array
          description: |
            Mentors with capacity to spare, so a manual pairing can be made
            without leaving the queue to go and find one.
          items:
            $ref: "#/components/schemas/AvailableMentor"

    AvailableMentor:
      type: object
      required: [participationId, name, load, capacity]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        load:
          type: integer
        capacity:
          type: integer
        skills:
          type: array
          items:
            type: string
        timezone:
          type: [string, "null"]

    StrandCreate:
      type: object
      required: [menteeParticipationId, mentorParticipationId]
      properties:
        menteeParticipationId:
          type: string
          format: uuid
        mentorParticipationId:
          type: string
          format: uuid

    RosterPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RosterEntry"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    PersonRef:
      type: object
      required: [participationId, name]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        photoUrl:
          type: [string, "null"]
          format: uri

    MentorLoad:
      type: object
      required: [mentor, load, capacity]
      properties:
        mentor:
          $ref: "#/components/schemas/PersonRef"
        load:
          type: integer
        capacity:
          type: integer

    PriorityBandStat:
      type: object
      required: [band, menteeCount, meanScore, medianScore]
      description: |
        The comparison that makes a run defensible: whether high-priority
        mentees came out with match quality comparable to low-priority ones.
      properties:
        band:
          $ref: "#/components/schemas/PriorityBand"
        menteeCount:
          type: integer
        meanScore:
          type: number
        medianScore:
          type: number

    ScoreBucket:
      type: object
      required: [rangeStart, rangeEnd, count]
      properties:
        rangeStart:
          type: number
        rangeEnd:
          type: number
        count:
          type: integer

    FairnessSummary:
      type: object
      required:
        [
          coverageRate,
          matchedCount,
          unmatchedCount,
          totalMentees,
          mentorLoad,
          priorityBands,
          scoreDistribution,
        ]
      properties:
        coverageRate:
          type: number
          minimum: 0
          maximum: 1
        matchedCount:
          type: integer
        unmatchedCount:
          type: integer
        totalMentees:
          type: integer
        mentorLoad:
          type: array
          items:
            $ref: "#/components/schemas/MentorLoad"
        priorityBands:
          type: array
          items:
            $ref: "#/components/schemas/PriorityBandStat"
        scoreDistribution:
          type: array
          items:
            $ref: "#/components/schemas/ScoreBucket"

    ScoreContribution:
      type: object
      description: >-
        One scored question's contribution to a pair's fit, with both sides'
        answers so a coordinator can see what was compared rather than only
        the number it produced.
      required: [fieldId, label, weight, direction, contribution]
      properties:
        fieldId:
          type: string
          format: uuid
        label:
          type: string
        weight:
          type: integer
        direction:
          type: string
          enum: [similar, complementary]
        contribution:
          type: number
          minimum: 0
          maximum: 1
        menteeAnswer:
          type: [string, "null"]
        mentorAnswer:
          type: [string, "null"]

    PriorityContribution:
      type: object
      description: >-
        One equity question's contribution to the mentee's priority score.
        Scales are inverted before they arrive here, so a higher value always
        means less existing access.
      required: [fieldId, label, weight, value]
      properties:
        fieldId:
          type: string
          format: uuid
        label:
          type: string
        weight:
          type: integer
        value:
          type: number
          minimum: 0
          maximum: 1
        answer:
          type: [string, "null"]

    DraftPair:
      type: object
      required: [id, mentee, mentor, score, priorityBand]
      properties:
        id:
          type: string
          format: uuid
        mentee:
          $ref: "#/components/schemas/PersonRef"
        mentor:
          $ref: "#/components/schemas/PersonRef"
        score:
          type: number
          minimum: 0
          maximum: 1
        priorityBand:
          $ref: "#/components/schemas/PriorityBand"
        scoreBreakdown:
          type: array
          description: Questions that produced a comparable number, highest weight first.
          items:
            $ref: "#/components/schemas/ScoreContribution"
        unscored:
          type: array
          description: >-
            Labels of scored questions that could not be compared for this pair,
            usually free text with no taxonomy behind it. Named rather than
            hidden, because they are the difference between the score shown and
            a score over every configured question.
          items:
            type: string
        priorityScore:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        priorityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PriorityContribution"

    Run:
      type: object
      required: [id, programId, state, progress, createdAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/RunState"
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: 0 to 1 while queued or running. 1 once drafted.
        recipeVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        publishedAt:
          type: [string, "null"]
          format: date-time
        publishedBy:
          type: [string, "null"]
        draftedCount:
          type: integer
        publishedCount:
          type: integer
        coverageRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [pairs, unmatchedCount]
          properties:
            fairnessSummary:
              oneOf:
                - $ref: "#/components/schemas/FairnessSummary"
                - type: "null"
            pairs:
              type: array
              items:
                $ref: "#/components/schemas/DraftPair"
            unmatchedCount:
              type: integer

    RunPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    NextActionKind:
      type: string
      enum:
        [
          complete_profile,
          accept_request,
          reply_to_message,
          log_session,
          fill_check_in,
        ]

    NextAction:
      type: object
      required: [kind, title, actionLabel, href]
      description: |
        The one thing worth doing, chosen by the server. Singular on purpose:
        design direction 9 gives home one next-action card and says that if
        there is no next action, say so plainly rather than inventing one. A
        list of three would be a list of none.
      properties:
        kind:
          $ref: "#/components/schemas/NextActionKind"
        title:
          type: string
        body:
          type: [string, "null"]
        actionLabel:
          type: string
          description: The verb here is the verb in the resulting toast.
        href:
          type: string
          description: |
            Relative to the program root. Nothing is done on home; every action
            is a link into the page that resolves it.

    Announcement:
      type: object
      required: [id, body, authorName, postedAt]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        authorName:
          type: string
        postedAt:
          type: string
          format: date-time

    Milestone:
      type: object
      required: [id, title, dueAt, completed]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        dueAt:
          type: string
          format: date-time
        completed:
          type: boolean

    HomeSummary:
      type: object
      required: [profileCompleteness, strandCount, mentorCount]
      properties:
        matchingOpensAt:
          type: [string, "null"]
          format: date-time
          description: |
            The date the waiting state is built around. Design direction 1: a
            participant signs up in September and is matched in October, and
            for those three weeks this date is the whole screen.
        mentorCount:
          type: integer
          description: |
            Mentors signed up to this program. Shown before matching so the
            wait reads as being part of something already populated.
        strandCount:
          type: integer
        profileCompleteness:
          type: number
          minimum: 0
          maximum: 1
        nextAction:
          oneOf:
            - $ref: "#/components/schemas/NextAction"
            - type: "null"
        announcement:
          oneOf:
            - $ref: "#/components/schemas/Announcement"
            - type: "null"
        upcomingMilestone:
          oneOf:
            - $ref: "#/components/schemas/Milestone"
            - type: "null"

    StrandMember:
      type: object
      required: [participationId, name, role]
      properties:
        participationId:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        headline:
          type: [string, "null"]
        photoUrl:
          type: [string, "null"]
          format: uri
        timezone:
          type: [string, "null"]
        skills:
          type: array
          items:
            type: string

    MessagePreview:
      type: object
      required: [authorName, body, sentAt]
      properties:
        authorName:
          type: string
        body:
          type: string
        sentAt:
          type: string
          format: date-time

    StrandSummary:
      type: object
      required: [id, programId, state, originMode, members, unreadCount]
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/StrandState"
        originMode:
          $ref: "#/components/schemas/OriginMode"
        members:
          type: array
          description: Everyone except the current account.
          items:
            $ref: "#/components/schemas/StrandMember"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/MessagePreview"
            - type: "null"
        lastActivityAt:
          type: [string, "null"]
          format: date-time
          description: |
            The UI derives the quiet state from this. There is no health enum,
            because a quiet strand is not an error and must not render as one.
        unreadCount:
          type: integer
        nextSessionAt:
          type: [string, "null"]
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Set when `state` is `ended`. The card names the date, so the
            summary has to carry it rather than making the list fetch each
            strand to find out when it finished.

    Strand:
      type: object
      required: [id, programId, state, originMode, members, createdAt]
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/StrandState"
        originMode:
          $ref: "#/components/schemas/OriginMode"
        members:
          type: array
          description: Every member, including the current account.
          items:
            $ref: "#/components/schemas/StrandMember"
        matchRationale:
          type: [string, "null"]
          description: |
            Why these people were put together. A partial explanation, not the
            explanation: in a global assignment the real reason often involves a
            third person. Present it as such.
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time

    MessageCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        clientToken:
          type: string
          description: |
            Echoed back on the created message so an optimistic send can be
            reconciled against the server row instead of duplicated.

    Message:
      type: object
      required: [id, strandId, author, body, sentAt, deliveryState]
      properties:
        id:
          type: string
          format: uuid
        strandId:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/PersonRef"
        body:
          type: string
        sentAt:
          type: string
          format: date-time
        deliveryState:
          type: string
          enum: [sent, delivered]
        clientToken:
          type: [string, "null"]

    MessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextCursor:
          type: [string, "null"]
          description: Pass as `before` to fetch the previous page. Null when at the start.
